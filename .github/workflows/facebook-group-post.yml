name: Chiping Facebook Group Post

on:
  repository_dispatch:
    types: [chiping-facebook-post]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      resume_blocked_queue:
        description: Resume after a Facebook security checkpoint has been cleared
        required: false
        type: boolean
        default: false
      verify_group_access:
        description: Log in and check the configured Group profile without posting
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: chiping-facebook-group-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore Chromium
        id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Save Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Restore encrypted Facebook state
        uses: actions/cache/restore@v4
        with:
          path: .facebook-state
          key: facebook-state-${{ github.run_id }}
          restore-keys: |
            facebook-state-

      - name: Prepare ephemeral Facebook secret files
        shell: bash
        env:
          FACEBOOK_LOGIN_EMAIL: ${{ secrets.FACEBOOK_LOGIN_EMAIL }}
          FACEBOOK_LOGIN_PASSWORD: ${{ secrets.FACEBOOK_LOGIN_PASSWORD }}
          FACEBOOK_POSTING_PROFILE_NAME: ${{ secrets.FACEBOOK_POSTING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/chiping-facebook-secrets"
          printf %s "$FACEBOOK_LOGIN_EMAIL" > "$RUNNER_TEMP/chiping-facebook-secrets/email"
          printf %s "$FACEBOOK_LOGIN_PASSWORD" > "$RUNNER_TEMP/chiping-facebook-secrets/password"

      - name: Process one Facebook Group job
        id: poster
        env:
          FACEBOOK_EVENT_PATH: ${{ github.event_path }}
          FACEBOOK_ACTION_STATE_FILE: ${{ github.workspace }}/.facebook-state/facebook-agent.enc
          FACEBOOK_STATE_ENCRYPTION_KEY: ${{ secrets.FACEBOOK_STATE_ENCRYPTION_KEY }}
          FACEBOOK_ACTION_POSTING_ENABLED: ${{ secrets.FACEBOOK_ACTION_POSTING_ENABLED }}
          FACEBOOK_ACTION_RESUME: ${{ inputs.resume_blocked_queue }}
          FACEBOOK_ACTION_VERIFY_GROUP_ACCESS: ${{ inputs.verify_group_access }}
          FACEBOOK_LOGIN_EMAIL_FILE: ${{ runner.temp }}/chiping-facebook-secrets/email
          FACEBOOK_LOGIN_PASSWORD_FILE: ${{ runner.temp }}/chiping-facebook-secrets/password
          FACEBOOK_POSTING_PROFILE_NAME: ${{ secrets.FACEBOOK_POSTING_PROFILE_NAME }}
          FACEBOOK_STORAGE_STATE_FILE: ${{ runner.temp }}/chiping-facebook-data/facebook-storage-state.json
          POSTER_DATA_DIR: ${{ runner.temp }}/chiping-facebook-data
          POSTER_HEADLESS: 'true'
          POSTER_MAX_ATTEMPTS: '5'
        run: node src/action-runner.mjs

      - name: Save encrypted Facebook state
        if: always() && steps.poster.outputs.state_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .facebook-state
          key: facebook-state-${{ github.run_id }}

      - name: Report safe access-check result
        if: always() && steps.poster.outputs.outcome == 'verification_failed'
        env:
          VERIFICATION_REASON: ${{ steps.poster.outputs.verification_reason }}
        run: printf 'Facebook access check failed: %s\n' "$VERIFICATION_REASON"

      - name: Flag a newly blocked queue
        if: steps.poster.outputs.alert == 'true'
        run: exit 1
