name: Preview Chiping Facebook Link Card

on:
  workflow_dispatch:
    inputs:
      product_id:
        description: Chiping product ID
        required: true
        type: string
      image_url:
        description: Exact prepared Open Graph image URL
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: chiping-facebook-group-poster
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore Chromium
        id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Restore encrypted Facebook state
        uses: actions/cache/restore@v4
        with:
          path: .facebook-state
          key: facebook-state-${{ github.run_id }}
          restore-keys: |
            facebook-state-

      - name: Render link card without posting
        id: preview
        env:
          FACEBOOK_PREVIEW_PRODUCT_ID: ${{ inputs.product_id }}
          FACEBOOK_PREVIEW_IMAGE_URL: ${{ inputs.image_url }}
          FACEBOOK_ACTION_STATE_FILE: ${{ github.workspace }}/.facebook-state/facebook-agent.enc
          FACEBOOK_STATE_ENCRYPTION_KEY: ${{ secrets.FACEBOOK_STATE_ENCRYPTION_KEY }}
          FACEBOOK_POSTING_PROFILE_NAME: ${{ secrets.FACEBOOK_POSTING_PROFILE_NAME }}
          FACEBOOK_TRUST_VERIFIED_PROFILE: 'true'
          FACEBOOK_STORAGE_STATE_FILE: ${{ runner.temp }}/chiping-facebook-data/facebook-storage-state.json
          POSTER_DATA_DIR: ${{ runner.temp }}/chiping-facebook-data
          POSTER_HEADLESS: 'true'
          FACEBOOK_DEBUG_DIR: ${{ runner.temp }}/facebook-link-preview-debug
          FACEBOOK_PREVIEW_SCREENSHOT_PATH: ${{ runner.temp }}/facebook-link-preview.png
        run: node src/preview-link.mjs

      - name: Upload composer preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-link-preview-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/facebook-link-preview.png
            ${{ runner.temp }}/facebook-link-preview-debug
          if-no-files-found: ignore
          retention-days: 1

      - name: Report result
        if: always()
        env:
          READY: ${{ steps.preview.outputs.ready }}
          PRODUCT_ID: ${{ inputs.product_id }}
        run: |
          printf 'Product %s link preview ready: %s\n' "$PRODUCT_ID" "${READY:-false}"
          test "${READY:-false}" = 'true'
