name: Chiping Facebook Remote Login

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: chiping-facebook-group-poster
  cancel-in-progress: false

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore Chromium
        id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Save Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Restore encrypted Facebook state
        uses: actions/cache/restore@v4
        with:
          path: .facebook-state
          key: facebook-state-${{ github.run_id }}
          restore-keys: |
            facebook-state-

      - name: Prepare ephemeral Facebook secret files
        shell: bash
        env:
          FACEBOOK_LOGIN_EMAIL: ${{ secrets.FACEBOOK_LOGIN_EMAIL }}
          FACEBOOK_LOGIN_PASSWORD: ${{ secrets.FACEBOOK_LOGIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/chiping-facebook-secrets"
          printf %s "$FACEBOOK_LOGIN_EMAIL" > "$RUNNER_TEMP/chiping-facebook-secrets/email"
          printf %s "$FACEBOOK_LOGIN_PASSWORD" > "$RUNNER_TEMP/chiping-facebook-secrets/password"

      - name: Start protected remote desktop
        id: remote
        shell: bash
        env:
          DISPLAY: :99
          FACEBOOK_VNC_PASSWORD: ${{ secrets.FACEBOOK_VNC_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb x11vnc openbox novnc websockify
          curl -fsSLo "$RUNNER_TEMP/cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/download/2026.7.3/cloudflared-linux-amd64
          printf '%s  %s\n' \
            '9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17' \
            "$RUNNER_TEMP/cloudflared" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/cloudflared"
          Xvfb :99 -screen 0 1365x900x24 -nolisten tcp >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          for attempt in {1..30}; do
            test -S /tmp/.X11-unix/X99 && break
            sleep 0.2
          done
          test -S /tmp/.X11-unix/X99
          openbox >"$RUNNER_TEMP/openbox.log" 2>&1 &
          x11vnc -storepasswd "$FACEBOOK_VNC_PASSWORD" "$RUNNER_TEMP/x11vnc.pass" >/dev/null
          x11vnc -display :99 -forever -shared -rfbauth "$RUNNER_TEMP/x11vnc.pass" \
            -localhost >"$RUNNER_TEMP/x11vnc.log" 2>&1 &
          websockify --web /usr/share/novnc 6080 localhost:5900 \
            >"$RUNNER_TEMP/websockify.log" 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:6080/vnc.html >/dev/null && break
            sleep 0.2
          done
          curl --fail --silent --show-error http://127.0.0.1:6080/vnc.html >/dev/null
          "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate \
            --url http://localhost:6080 >"$RUNNER_TEMP/cloudflared.log" 2>&1 &
          remote_url=''
          for attempt in {1..30}; do
            remote_url="$(
              grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' \
                "$RUNNER_TEMP/cloudflared.log" | tail -1 || true
            )"
            test -n "$remote_url" && break
            sleep 1
          done
          test -n "$remote_url"
          remote_host="${remote_url#https://}"
          [[ "$remote_host" =~ ^[a-z0-9-]+\.trycloudflare\.com$ ]]
          pages_dir="$RUNNER_TEMP/facebook-remote-pages"
          mkdir -p "$pages_dir"
          cp -R /usr/share/novnc/. "$pages_dir/"
          printf '%s\n' "$GITHUB_RUN_ID" > "$pages_dir/ready-${GITHUB_RUN_ID}.txt"
          printf '/*\n  Cache-Control: no-store\n  X-Robots-Tag: noindex, nofollow, noarchive\n  Referrer-Policy: no-referrer\n' \
            > "$pages_dir/_headers"
          npx --yes wrangler@4.75.0 pages deploy "$pages_dir" \
            --project-name chiping-fb-login \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Temporary Facebook login ${GITHUB_RUN_ID}" \
            --commit-dirty=true
          browser_url="https://fb-login.chiping.co.il/vnc?autoconnect=true&resize=scale&host=${remote_host}&port=443&encrypt=true&path=websockify"
          ready_url="https://fb-login.chiping.co.il/ready-${GITHUB_RUN_ID}.txt"
          for attempt in {1..90}; do
            test "$(curl --fail --silent "$ready_url" || true)" = "$GITHUB_RUN_ID" && break
            sleep 1
          done
          test "$(curl --fail --silent "$ready_url")" = "$GITHUB_RUN_ID"
          for attempt in {1..30}; do
            curl --fail --silent "$browser_url" >/dev/null && break
            sleep 1
          done
          curl --fail --silent --show-error "$browser_url" >/dev/null
          printf 'remote_url=%s\n' "$browser_url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$browser_url" > "$RUNNER_TEMP/facebook-remote-url.txt"
          printf 'Remote browser URL: %s\n' "$browser_url"
          printf '::notice title=Temporary Facebook browser::%s\n' "$browser_url"
          {
            printf '### Temporary Facebook browser\n\n'
            printf 'Open [%s](%s) while this workflow is running.\n' "$browser_url" "$browser_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish temporary browser link
        uses: actions/upload-artifact@v4
        with:
          name: facebook-remote-login-${{ github.run_id }}
          path: ${{ runner.temp }}/facebook-remote-url.txt
          if-no-files-found: error
          retention-days: 1

      - name: Complete and encrypt remote Facebook login
        env:
          DISPLAY: :99
          FACEBOOK_ACTION_STATE_FILE: ${{ github.workspace }}/.facebook-state/facebook-agent.enc
          FACEBOOK_STATE_ENCRYPTION_KEY: ${{ secrets.FACEBOOK_STATE_ENCRYPTION_KEY }}
          FACEBOOK_LOGIN_EMAIL_FILE: ${{ runner.temp }}/chiping-facebook-secrets/email
          FACEBOOK_LOGIN_PASSWORD_FILE: ${{ runner.temp }}/chiping-facebook-secrets/password
          FACEBOOK_POSTING_PROFILE_NAME: ${{ secrets.FACEBOOK_POSTING_PROFILE_NAME }}
          FACEBOOK_STORAGE_STATE_FILE: ${{ runner.temp }}/chiping-facebook-data/facebook-storage-state.json
          FACEBOOK_INTERACTIVE_LOGIN_TIMEOUT_MS: '1800000'
          POSTER_DATA_DIR: ${{ runner.temp }}/chiping-facebook-data
          POSTER_HEADLESS: 'false'
        run: node src/interactive-login.mjs

      - name: Save encrypted Facebook state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .facebook-state
          key: facebook-state-${{ github.run_id }}
